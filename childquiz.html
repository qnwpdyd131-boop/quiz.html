<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>브롤스타즈 테마 아토피 퀴즈</title>
    <!-- 귀여운 폰트 적용 (구글 폰트) -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Jua', 'Comic Sans MS', sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            /* 만화책 망점(Halftone) 무늬 + 사막 느낌의 배경 */
            background-color: #f4a261; /* 사막 주황색 */
            background-image: radial-gradient(#d98236 15%, transparent 16%),
                              radial-gradient(#d98236 15%, transparent 16%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }

        /* 굵은 테두리와 진한 그림자를 가진 코믹스 컨테이너 */
        .comic-container {
            background-color: #e0e0e0;
            border: 5px solid #000;
            border-radius: 12px;
            box-shadow: 8px 8px 0px #000;
            width: 100%;
            max-width: 650px;
            padding: 25px;
            position: relative;
            display: none; /* JS로 제어 */
        }
        .comic-container.active {
            display: block;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 텍스트 스타일 */
        .title {
            text-align: center;
            font-size: 3rem;
            color: #ffeb3b;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 4px 4px 0 #000;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        /* 상단 상태바 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            font-size: 1.8rem;
            color: #fff;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
            margin-bottom: 20px;
        }

        /* 캐릭터 + 말풍선 영역 */
        .speech-area {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
        }

        /* 캐릭터 프로필 이미지 (SVG 컨테이너) */
        .char-profile {
            width: 110px;
            height: 110px;
            background-color: #fff;
            border: 4px solid #000;
            border-radius: 50%;
            box-shadow: 4px 4px 0 #000;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .char-name {
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ffeb3b;
            border: 3px solid #000;
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 1rem;
            white-space: nowrap;
            z-index: 10;
        }

        .char-wrapper {
            position: relative;
            margin-right: 20px;
            margin-bottom: 15px;
        }

        /* 말풍선 */
        .speech-bubble {
            background-color: #fff;
            border: 4px solid #000;
            border-radius: 12px;
            padding: 20px;
            font-size: 1.4rem;
            position: relative;
            box-shadow: 4px 4px 0 #000;
            flex-grow: 1;
            word-break: keep-all;
        }
        
        /* 말풍선 꼬리 */
        .speech-bubble::before {
            content: '';
            position: absolute;
            left: -18px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 12px 18px 12px 0;
            border-style: solid;
            border-color: transparent #000 transparent transparent;
        }
        .speech-bubble::after {
            content: '';
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%);
            border-width: 9px 14px 9px 0;
            border-style: solid;
            border-color: transparent #fff transparent transparent;
        }

        /* 버튼 */
        .btn {
            display: flex;
            align-items: center;
            width: 100%;
            border: 4px solid #000;
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 4px 4px 0px #000;
            margin-bottom: 15px;
            transition: transform 0.1s, box-shadow 0.1s;
            text-align: left;
            word-break: keep-all;
        }

        .btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px #000;
        }

        .btn-start { background-color: #2196f3; color: #fff; justify-content: center; font-size: 2rem; }
        .btn-restart { background-color: #f44336; color: #fff; justify-content: center; font-size: 1.8rem; margin-top: 20px; }
        
        .btn-a { background-color: #ff9800; color: #000; }
        .btn-b { background-color: #4caf50; color: #fff; }

        .badge {
            background-color: #000;
            color: #fff;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            flex-shrink: 0;
            font-size: 1.2rem;
        }

        /* 모달 (팝업창) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }

        .modal-box {
            background-color: #fff;
            border: 5px solid #000;
            border-radius: 15px;
            box-shadow: 8px 8px 0 #000;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            animation: popIn 0.3s;
        }

        .modal-title {
            font-size: 3rem;
            margin-bottom: 15px;
            text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
        }
        .text-correct { color: #4caf50; }
        .text-wrong { color: #f44336; }

        .modal-exp {
            background-color: #eeeeee;
            border: 3px solid #000;
            border-radius: 10px;
            padding: 20px;
            font-size: 1.3rem;
            line-height: 1.5;
            margin-bottom: 20px;
            word-break: keep-all;
        }

        .btn-next {
            background-color: #ffeb3b;
            color: #000;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 0;
        }

        @media (max-width: 500px) {
            .char-profile { width: 80px; height: 80px; }
            .speech-bubble { font-size: 1.1rem; padding: 15px; }
            .btn { font-size: 1.1rem; padding: 12px; }
            .title { font-size: 2.5rem; }
            .status-bar { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <!-- 1. 시작 화면 -->
    <div id="screen-start" class="comic-container active" style="text-align: center;">
        <h1 class="title">아토피 관리<br>브롤 퀴즈!</h1>
        <div style="font-size: 5rem; margin-bottom: 20px;">🌵</div>
        <button class="btn btn-start" onclick="startQuiz()">게임 시작!</button>
    </div>

    <!-- 2. 퀴즈 화면 -->
    <div id="screen-quiz" class="comic-container">
        <div class="status-bar">
            <div id="ui-progress">문제 1 / 12</div>
            <div id="ui-score">점수: 0</div>
        </div>

        <div class="speech-area">
            <div class="char-wrapper">
                <div class="char-profile" id="ui-char-svg">
                    <!-- SVG 삽입 위치 -->
                </div>
                <div class="char-name" id="ui-char-name">스파이크</div>
            </div>
            <div class="speech-bubble" id="ui-question">
                질문이 들어갑니다!
            </div>
        </div>

        <button class="btn btn-a" onclick="checkAnswer('A')">
            <div class="badge">A</div>
            <span id="ui-opt-a">A 선택지</span>
        </button>
        <button class="btn btn-b" onclick="checkAnswer('B')">
            <div class="badge">B</div>
            <span id="ui-opt-b">B 선택지</span>
        </button>
    </div>

    <!-- 3. 모달 (해설) -->
    <div id="modal-feedback" class="modal-overlay">
        <div class="modal-box">
            <h2 id="modal-title" class="modal-title text-correct">정답!</h2>
            <div id="modal-exp" class="modal-exp">
                해설 내용이 여기에 나타납니다.
            </div>
            <button class="btn btn-next" onclick="nextQuestion()">다음 ➔</button>
        </div>
    </div>

    <!-- 4. 결과 화면 -->
    <div id="screen-result" class="comic-container" style="text-align: center;">

            0 / 12

        <button class="btn btn-restart" onclick="location.reload()">처음부터 다시 하기</button>
    </div>

            },
            {
                q: "아토피가 며칠 동안 괜찮아서 연고를 끊고 싶다!",
                a: "증상이 없어졌으니 처방받은 치료를 무조건 중단한다.",
                b: "임의로 중단하지 않고 처방받은 사용법을 확인한다.",
                ans: "B",
                exp: "피부가 좋아졌다고 해서 약을 바로 끊어도 되는 것은 아니야. 처방받은 방법을 따르자!"
            },
            {
                q: "처방받은 연고를 발랐는데도 증상이 계속 심해진다!",
                a: "처방된 용법을 지키고 보호자와 함께 의료진에게 상담한다.",
                b: "연고를 더 많이 바른다.",
                ans: "A",
                exp: "연고를 많이 바른다고 더 빨리 낫는 것은 아니야. 계속 가렵다면 의료진에게 도움을 받자!"
            }
        ];

        // --- 3. 게임 로직 ---
        let currentIndex = 0;
        let score = 0;

        function showScreen(id) {
            document.querySelectorAll('.comic-container').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startQuiz() {
            currentIndex = 0;
            score = 0;
            showScreen('screen-quiz');
            loadQuestion();
        }

        function loadQuestion() {
            const data = quizData[currentIndex];
            
            // 상태 업데이트
            document.getElementById('ui-progress').innerText = `문제 ${currentIndex + 1} / ${quizData.length}`;
            document.getElementById('ui-score').innerText = `점수: ${score}`;
            
            // 랜덤 캐릭터 지정
            const char = characters[Math.floor(Math.random() * characters.length)];
            document.getElementById('ui-char-svg').innerHTML = char.svg;
            document.getElementById('ui-char-name').innerText = char.name;

            // 문제 텍스트
            document.getElementById('ui-question').innerText = data.q;
            document.getElementById('ui-opt-a').innerText = data.a;
            document.getElementById('ui-opt-b').innerText = data.b;
        }

        function checkAnswer(selected) {
            const data = quizData[currentIndex];
            const modalTitle = document.getElementById('modal-title');
            
            if (selected === data.ans) {
                score++;
                modalTitle.innerText = "⭐ 정답! ⭐";
                modalTitle.className = "modal-title text-correct";
            } else {
                modalTitle.innerText = "💥 오답! 💥";
                modalTitle.className = "modal-title text-wrong";
            }

            document.getElementById('ui-score').innerText = `점수: ${score}`;
            document.getElementById('modal-exp').innerText = data.exp;
            document.getElementById('modal-feedback').classList.add('active');
        }

        function nextQuestion() {
            document.getElementById('modal-feedback').classList.remove('active');
            currentIndex++;

            if (currentIndex < quizData.length) {
                loadQuestion();
            } else {
                endQuiz();
            }
        }

        function endQuiz() {
            showScreen('screen-result');
            document.getElementById('ui-final-score').innerText = `${score} / ${quizData.length}`;
        }
    </script>
